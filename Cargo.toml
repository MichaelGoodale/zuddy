[package]
name = "zuddy"
version = "0.1.0"
edition = "2024"


[dependencies]
ahash = "0.8.12"
dashmap = { version = "6.2.1", features = ["rayon", "serde"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
mem_dbg = { git = "https://github.com/MichaelGoodale/mem_dbg-rs.git", features = [
  "std",
  "derive",
  "ordered-float",
] }
num-traits = "0.2.19"
ordered-float = { version = "5.3.0", features = ["serde"] }
rand = { version = "0.10.1", optional = true }
rangemap = "1.7.1"
rayon = "1.12.0"
recursive = "0.1.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["v4"] }
zerocopy = { version = "0.8.52", features = ["std", "derive", "alloc"] }

[dev-dependencies]
itertools = "0.15.0"
ron = "0.12.1"
divan = "0.1.21"
anyhow = "1.0.103"

[[bench]]
name = "queens"
harness = false

[[bench]]
name = "joins"
harness = false

[features]
default = ["sampling"]
sampling = ["dep:rand"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true         # or debug = "line-tables-only" for lighter symbol info
strip = false
lto = false          # optional: disable if you want cleaner inlining boundaries
